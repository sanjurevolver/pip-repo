[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pip-repro"
version = "0.1.0"
description = "Audit Python dependency files for future installability, yanked versions, and Python compatibility risks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "sanjurevolver", email = "sanjurevolver@example.com" }]
keywords = [
    "python",
    "pip",
    "pypi",
    "dependency-management",
    "dependencies",
    "packaging",
    "security",
    "ci",
    "cli",
    "audit",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "httpx>=0.27",
    "packaging>=24",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3",
    "build>=1",
    "twine>=5",
]

[project.scripts]
pip-repro = "pip_repro.cli:app"

[project.urls]
Homepage = "https://github.com/sanjurevolver/pip-repo"
Repository = "https://github.com/sanjurevolver/pip-repo"
Issues = "https://github.com/sanjurevolver/pip-repo/issues"
Documentation = "https://github.com/sanjurevolver/pip-repo/blob/main/README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
